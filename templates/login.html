{% extends "base.html" %}

{% block title %}FireTon  |  Login{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Welcome Back</h2>
    <p class="subtitle">Login to your FireTon account</p>

    <form method="POST" class="auth-form" action="{{ url_for('login') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="auth-link" style="margin-top: 1rem; font-size: 0.9em;">
        <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
    </div>
    <p class="auth-link" style="margin-top: 1rem;">
        New here? <a href="{{ url_for('register') }}">Create an account</a>
    </p>
</div>
{% endblock %}
