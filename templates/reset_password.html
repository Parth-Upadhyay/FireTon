{% extends "base.html" %}

{% block title %}Reset Password - FireTon{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Reset Your Password</h2>
    <p class="subtitle">Enter your new password below.</p>

    <form method="POST" action="{% if token %}{{ url_for('reset_password', token=token) }}{% else %}{{ url_for('reset_password') }}{% endif %}">
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" 
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                   title="Must contain at least one uppercase, one lowercase, one number, and 8+ characters"
                   required>
            <small id="password-hint">Must include uppercase, lowercase, number, 8+ characters.</small>
        </div>
        <div class="form-group">
            <label for="password_confirm">Confirm New Password</label>
            <input type="password" id="password_confirm" name="password_confirm" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Reset Password</button>
    </form>
</div>
{% endblock %}
