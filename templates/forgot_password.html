{% extends "base.html" %}

{% block title %}Forgot Password - FireTon{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email to get a reset code.</p>

    <form method="POST" action="{{ url_for('forgot_password') }}">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
    <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Code</button>
    </form>
    
    <div class="auth-link" style="margin-top: 1rem;">
        Remembered your password? <a href="{{ url_for('login') }}">Log In</a>
    </div>
</div>
{% endblock %}
