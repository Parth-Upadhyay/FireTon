{% extends "base.html" %}

{% block title %}Verify Reset Code - FireTon{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Verify Reset Code</h2>
    <p class="subtitle">We sent a 6-digit code to your email. Enter it to reset your password.</p>

    <form method="POST" action="{{ url_for('verify_reset') }}">
        <div class="form-group">
            <label for="otp">6-Digit Code</label>
            <input type="text" id="otp" name="otp" required maxlength="6" pattern="\d{6}" title="Enter the 6-digit code">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Verify Code</button>
    </form>
    
    <div class="auth-link" style="margin-top: 1rem;">
        <a href="{{ url_for('forgot_password') }}">Back to Request Reset</a>
    </div>
</div>
{% endblock %}
