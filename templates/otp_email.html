<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Code</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .otp-code {
            display: inline-block;
            padding: 12px 20px;
            margin: 20px 0;
            background-color: #f4f4f4;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            border-radius: 5px;
        }
        p {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hi, {{ username }}!</h2>
        <p>Here is your single-use code for FireTon:</p>
        
        <div class="otp-code">{{ otp }}</div>
        
        <p>This code is valid for 10 minutes.</p>
        
        <p style="font-size: 0.9em; color: #777;">If you did not request this, you can safely ignore this email.</p>
    </div>
</body>
</html>
