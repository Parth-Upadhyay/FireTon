{% extends "base.html" %}
{% block title %}FireTon  |  Register{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Register</h2>
    <form method="POST" class="auth-form" id="registerForm" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                   title="Must contain at least one uppercase, one lowercase, one number, and 8+ characters"
                   required>
            <small id="password-hint">Password must include uppercase, lowercase, number, 8+ characters.</small>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="auth-link">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", e => {
    const pwd = document.getElementById("password").value;
    const strong = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(pwd);
    if (!strong) {
        e.preventDefault();
        alert("Weak password. It must include upper, lower, number, and 8+ characters.");
    }
});
</script>
{% endblock %}
